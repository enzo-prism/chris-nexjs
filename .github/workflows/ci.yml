name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Type and contract checks
        run: |
          pnpm run check
          pnpm run llms:generate
          git diff --exit-code -- public/llms.txt client/public/llms.txt
          pnpm run test:api
          pnpm run test:analytics
          pnpm run test:analytics:mutants
          pnpm run test:routes
          pnpm run test:seo
          pnpm run test:design-system

      - name: Focused source and content guards
        run: |
          node scripts/mobile-ux-source.test.mjs
          pnpm exec tsx scripts/contact-form-ux.test.ts
          pnpm exec tsx scripts/og-meta-check.ts
          pnpm run test:gallery
          pnpm run test:invisalign-media
          pnpm run test:image-retry
          pnpm run test:reviews
          pnpm run test:blog-index

      - name: Invisalign media facade (dev preview)
        run: pnpm run test:invisalign-media:e2e

      - name: Mobile browser suite
        run: pnpm run test:mobile

      - name: Build app for runtime audits
        run: pnpm run build

      - name: Confirm fixture preview is excluded from production
        run: pnpm run test:invisalign-media

      - name: Staged SMS strings must not appear in .next/static, .next/server, public/, or client/public/
        run: SMS_STAGED_SKIP_BUILD=1 pnpm run test:sms-staged-static

      - name: Install Tesseract for SMS OCR
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Runtime SEO, image, and Twilio visibility audits
        run: |
          pnpm exec next start -p 3200 &
          SERVER_PID=$!
          cleanup() {
            kill $SERVER_PID >/dev/null 2>&1 || true
            wait $SERVER_PID >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          sleep 8
          IMAGE_AUDIT_BASE_URL=http://localhost:3200 pnpm run test:images
          SEO_AUDIT_BASE_URL=http://localhost:3200 pnpm run test:seo:onpage
          SEO_AUDIT_BASE_URL=http://localhost:3200 pnpm run test:seo:links
          SEO_AUDIT_BASE_URL=http://localhost:3200 pnpm run test:seo:schema
          # Pixel-truth + OCR of SMS consent passages at 390 and 1440.
          PLAYWRIGHT_BASE_URL=http://localhost:3200 pnpm run test:sms-visibility

      - name: Analytics host-silence network spec
        run: |
          pnpm exec next start -p 3200 &
          SERVER_PID=$!
          cleanup() {
            kill $SERVER_PID >/dev/null 2>&1 || true
            wait $SERVER_PID >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          sleep 5
          PLAYWRIGHT_BASE_URL=http://localhost:3200 pnpm run test:analytics:network

  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build perf dist
        run: pnpm run build:perf

      - name: Bundle budget gate
        run: NEXT_DIST_DIR=.next-perf pnpm run test:bundle

      - name: Run perf smoke + lighthouse
        run: |
          NEXT_DIST_DIR=.next-perf pnpm exec next start -p 3101 &
          SERVER_PID=$!
          cleanup() {
            kill $SERVER_PID >/dev/null 2>&1 || true
            wait $SERVER_PID >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          sleep 8
          PERF_BASE_URL=http://localhost:3101 pnpm run perf:smoke
          LIGHTHOUSE_BASE_URL=http://localhost:3101 LIGHTHOUSE_RUNS=3 pnpm run perf:lighthouse
